name: pharmagraph

services:
  neo4j:
    image: neo4j:5.26.32-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1 AS ready;" > /dev/null 2>&1'
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 12
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
